<title>Udaio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Euiro iskeleti (üst bar · solda blok menü · ortada panel), koyu yeşil zemin üstünde mat bölüm renkleri.
   Tek bilinçli görünüm: koyu yeşil; bütün renkler açıkça tanımlı. Tek yazı tipi: Pixelify Sans.
   Telefonda menü yatay şerit olur, sayfa normal kayar. */
:root{
  --bg:#13241C; --bg-dot:#1C3329; --paper:#1A2F25; --paper-2:#21392D; --ink:#E9EEDF; --on-c:#10201A; --edge:#08110C;
  --muted:#A7B8A3; --line:#2F4A3C; --soft:#7D937D;
  --c-ai:#86ABC2; --c-zihin:#97BA8F; --c-founder:#D6B267; --c-psiko:#CC937F; --c-meta:#A595C4; --c-time:#83BCAD;
  --ok:#A9CF8F; --mid:#E3CB7A; --warn:#DE9C88;
  --screen:#0C1812;
  --f:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --bw:3px; --sh:0 4px 0 var(--edge);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.3px,transparent 1.4px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-founder);outline-offset:3px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:16px;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blk{border:var(--bw) solid var(--edge);box-shadow:var(--sh);border-radius:0}
button.blk{cursor:pointer;transition:transform .06s}
button.blk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.lab{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* ÜST BAR */
.top{display:flex;align-items:stretch;gap:12px;min-width:0}
.logo{background:var(--c-founder);color:var(--on-c);display:flex;align-items:center;gap:10px;padding:8px 14px;flex:none}
.logo .m{width:32px;height:32px;background:var(--on-c);color:var(--c-founder);display:grid;place-items:center;font-weight:700;font-size:20px}
.logo h1{margin:0;font-weight:700;font-size:clamp(20px,2.6vw,26px);line-height:1.2;letter-spacing:.08em}
.quote{flex:1;min-width:0;position:relative;background:var(--paper);overflow:hidden;display:flex;align-items:center;text-align:left;padding:0;cursor:pointer}
.quote .fill{position:absolute;inset:0 auto 0 0;background:var(--paper-2);border-right:3px solid var(--c-zihin);transition:width .4s}
.quote .qt{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px}
.quote .q{flex:1;min-width:0;font-size:16px;line-height:1.35;text-wrap:balance}
.quote .q.in{animation:qin .4s ease-out}
@keyframes qin{from{opacity:0;transform:translateY(6px)}}
.quote b{flex:none;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--c-zihin);white-space:nowrap}

/* SAHNE */
.stage{display:grid;grid-template-columns:228px minmax(0,1fr);gap:18px;align-items:start}
.stage > *{min-width:0}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:11px}
.side .lab{color:var(--muted);padding-left:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;text-align:left;background:var(--paper);min-width:0;position:relative}
.nav .ico{width:28px;height:28px;flex:none;display:grid;place-items:center;background:var(--edge);color:var(--c);font-weight:700;font-size:14px}
.nav .nn{font-weight:600;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav[aria-current="page"]{background:var(--c);color:var(--on-c)}
.nav[aria-current="page"]::after{content:"";position:absolute;right:10px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--on-c)}

/* PANEL */
.panel{background:var(--paper);border:var(--bw) solid var(--edge);box-shadow:0 6px 0 var(--edge);min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--paper-2);border-bottom:var(--bw) solid var(--edge)}
.tab{padding:1px 9px;border:var(--bw) solid var(--edge);background:var(--c);color:var(--on-c)}
.crumb{color:var(--soft);margin-left:auto}
.body{padding:22px 22px 28px;display:grid;gap:22px}
.body > *{min-width:0}

.hero{display:grid;gap:8px;max-width:64ch}
.eyebrow{color:var(--muted)}
.hero h2{margin:0;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.08;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:17.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;background:var(--paper-2);padding:0;min-width:0}
.card .cth{position:relative;aspect-ratio:16/7;max-width:100%;background:var(--c);border-bottom:var(--bw) solid var(--edge);overflow:hidden}
.card .cth canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.card .cth .dur,.card .cth .who{position:absolute;bottom:8px;font-weight:600;font-size:12px;letter-spacing:.05em;padding:0 6px;border:2px solid var(--edge)}
.card .cth .dur{right:8px;background:var(--edge);color:var(--ink)}
.card .cth .who{left:8px;background:var(--ink);color:var(--on-c)}
.card .ci{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.card .ct{font-weight:600;font-size:20px;line-height:1.2}
.card .cs{font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:2px}
.st{font-weight:600;font-size:12px;letter-spacing:.05em;padding:0 7px;border:2px solid var(--edge);background:var(--paper);color:var(--ink)}
.st[data-s="izlendi"]{background:var(--mid);color:var(--on-c)}.st[data-s="uygulaniyor"]{background:var(--ok);color:var(--on-c)}
.go{font-weight:600;font-size:14px;color:var(--c)}
.soon{display:grid;gap:10px}
.soon h3{margin:0;color:var(--muted)}
.soonl{display:flex;gap:10px;flex-wrap:wrap}
.soonl span{border:2px dashed var(--soft);padding:4px 10px;font-size:15px;color:var(--muted)}
.empty{border:var(--bw) dashed var(--line);padding:12px 14px;color:var(--muted);max-width:560px;font-size:16px}

/* NOT SAYFASI */
.back{justify-self:start;padding:4px 12px;background:var(--paper-2)}
.nhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
.nhead > *{min-width:0}
.screen{background:var(--screen);border:var(--bw) solid var(--edge);box-shadow:var(--sh);aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;display:grid;place-items:center}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.6}
.screen .play{position:relative;background:var(--c);color:var(--on-c);border:var(--bw) solid var(--edge);box-shadow:var(--sh);padding:8px 14px;font-weight:600;font-size:15px;letter-spacing:.05em}
.screen .demo{position:absolute;left:10px;top:10px;color:var(--muted);background:rgba(0,0,0,.4);padding:0 6px}
.meta{display:grid;gap:10px;align-content:start}
.mrow{display:grid;gap:4px;padding:10px 12px;border:2px solid var(--edge);background:var(--paper-2)}
.mrow .k{color:var(--soft)}
.mrow .v{font-size:15.5px;line-height:1.4;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-weight:600;font-size:12px;letter-spacing:.05em;padding:2px 8px;border:2px solid var(--edge);background:var(--paper);cursor:pointer;box-shadow:0 2px 0 var(--edge)}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--on-c)}
.warnline{margin:0;font-size:14.5px;color:var(--muted);border-left:4px solid var(--line);padding-left:10px}

.secs{display:grid;gap:18px;max-width:780px}
.sec{border:var(--bw) solid var(--edge);background:var(--paper-2);box-shadow:var(--sh)}
.sec > h3{margin:0;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:var(--bw) solid var(--edge);background:var(--paper)}
.sec > h3 i{font-style:normal;background:var(--c);color:var(--on-c);padding:0 7px}
.sec .sb{padding:14px 16px 16px}
.sec .sb p{margin:0;font-size:17.5px;line-height:1.6}
.terms{margin:0;display:grid;gap:10px}
.term{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:4px 14px;padding-bottom:10px;border-bottom:2px dotted var(--line)}
.term:last-child{border-bottom:0;padding-bottom:0}
.term dt{font-weight:600;font-size:17.5px;line-height:1.3;color:var(--c)}
.term dd{margin:0;font-size:16px;color:var(--muted);line-height:1.5}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;cursor:pointer;padding:8px 10px;border:2px solid var(--line);background:var(--paper)}
.step input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:var(--bw) solid var(--edge);background:var(--paper-2);display:grid;place-items:center;cursor:pointer}
.step input:checked{background:var(--c-zihin)}
.step input:checked::after{content:"";width:10px;height:10px;background:var(--on-c)}
.step span{font-size:16.5px;line-height:1.45}
.step:has(input:checked){border-color:var(--edge)}
.step:has(input:checked) span{color:var(--soft);text-decoration:line-through;text-decoration-thickness:1px}
.evid{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:16px}
.ev .lv{font-weight:600;font-size:12px;letter-spacing:.05em;padding:0 6px;border:2px solid var(--edge);white-space:nowrap;color:var(--on-c)}
.lv.y{background:var(--ok)}.lv.m{background:var(--mid)}.lv.n{background:var(--warn)}

@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:9px;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
  .side::-webkit-scrollbar{display:none}
  .side > *{flex:none;scroll-snap-align:start}
  .side .lab{display:none}
  .nav{padding:7px 10px}
  .nav .nn{font-size:16px}
  .nav[aria-current="page"]::after{content:none}
  .nhead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .app{gap:12px;padding-block:12px 32px}
  .top{flex-wrap:wrap}
  .logo{flex:1 1 100%;justify-content:flex-start}
  .quote{flex:1 1 100%;min-height:58px}
  .body{padding:16px 14px 22px;gap:18px}
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .term{grid-template-columns:minmax(0,1fr)}
  .crumb{display:none}
  .sec .sb{padding:12px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo blk"><span class="m" aria-hidden="true">U</span><h1>UDAIO</h1></div>
    <button class="quote blk" id="quote" type="button" aria-label="Sonraki motivasyon sözü">
      <span class="fill" id="qfill"></span>
      <span class="qt"><span class="q" id="qtext"></span><b id="qnum" title="Uygulanan not sayısı">0/0</b></span>
    </button>
  </header>

  <div class="stage">
    <nav class="side" id="side" aria-label="Bölümler"></nav>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
</div>

<script>

 "Seni senin kadar ileri itebilecek kimse yok."
];

const S = [
 {id:"ai",ico:"AI",name:"AI · LLM",c:"--c-ai",title:"AI'ı tam potansiyelle kullanmak",
  desc:"LLM'lerin nasıl çalıştığını kodsuz anla, prompt yazmayı öğren, istediğini yaptır.",
  soon:["Deep Dive into LLMs","Prompting 101","Claude'a oyun yaptırmak"]},
 {id:"zihin",ico:"Zi",name:"Zihin & Beyin",c:"--c-zihin",title:"Beynini şekillendirmek",
  desc:"Nöroplastisite, odak, hafıza, dopamin ve zihinsel imgeleme.",

 {id:"founder",ico:"Fo",name:"Founder",c:"--c-founder",title:"Kurucu gibi düşünmek",

 {id:"time",ico:"Tb",name:"Timeboxing",c:"--c-time",title:"Zamanı kutulara bölmek",

  soon:["Timeboxing nedir?","Günü takvimde planlamak","Parkinson yasası","Pomodoro ile farkı"]}
];

const N = [
 {id:"llm",s:"ai",t:"LLM'leri nasıl kullanıyorum?",who:"KARPATHY",dur:"2 SA 11 DK",reel:"AI bölümünün temel videosu",
  sum:"Andrej Karpathy, LLM'leri günlük hayatta nasıl kullandığını teknik olmayan bir dille gösteriyor. Model aslında interneti sıkıştıran bir “zip dosyası”; belli bir tarihe kadar olanı biliyor. Düşünen modeller, arama, derin araştırma, dosya ve kod araçlarını hangi işte kullanacağını bilirsen çok daha fazla verim alırsın.",
  terms:[["Token","Modelin metni okuduğu küçük parçalar; kelime değil."],["Bağlam penceresi","Modelin çalışma belleği. Doldukça eski kısımlara daha az odaklanır."],["Bilgi kesim tarihi","Eğitimden sonrasını bilmez; güncel bilgi için arama gerekir."],["Düşünen modeller","Cevaptan önce düşünür; kod, matematik ve zor problemlerde daha iyi."],["LLM Konseyi","Önemli kararda aynı soruyu birkaç modele sorup karşılaştırmak."]],
  steps:["Konu değişince yeni sohbet aç.","Zor işlere düşünen model, hızlı sorulara normal model seç.","Güncel bir şey soruyorsan aramayı aç.","Sayıları kafadan değil “Python ile hesapla” diyerek yaptır.","Kendin için bir özel talimat yaz."]},
 {id:"noro",s:"zihin",t:"Beynini değiştirmek için odaklan",who:"HUBERMAN",dur:"1 SA 28 DK",reel:"Dear men… study Neuroplasticity",
  sum:"Yetişkin beyni sadece maruz kalarak değişmez; değişimi yoğun odak ve uyanıklık başlatır, uyku ve derin dinlenme kalıcı hale getirir. Zorlanmak ve hata yapmak, beynin değişmeye başladığının işaretidir.",
  terms:[["Nöroplastisite","Bağlantıların deneyime göre güçlenmesi ya da zayıflaması."],["Epinefrin","Uyanıklık; öğrenme sinyalinin açık düğmesi."],["Asetilkolin","Odağın kimyasalı; neyin değişeceğini işaretler."],["Görsel odak","Gözü bir noktaya sabitlemek zihni de odaklar."],["NSDR","Uykusuz derin dinlenme; öğrenileni sağlamlaştırır."]],
  steps:["Başlamadan 30-60 sn bir noktaya bak.","En fazla 90 dakikalık bloklar halinde çalış.","Zorlanınca bırakma; bu iyi işaret.","Oturumdan sonra 10-20 dk NSDR yap.","O gece iyi uyu."]},
 {id:"hafiza",s:"zihin",t:"Hafıza sarayı",who:"J. FOER · TED",dur:"20 DK",reel:"3 Ways To Develop a Photographic Memory",
  sum:"Hafıza şampiyonları dahi değil; 2.500 yıllık bir teknik kullanıyorlar. Beynimiz soyut bilgiyi değil, mekânları ve canlı görüntüleri çok iyi hatırlar. Joshua Foer bir yıl çalışıp ABD Hafıza Şampiyonası'nı kazandı.",
  terms:[["Hafıza sarayı","Bilgiyi iyi bildiğin bir mekâna zihninde yerleştirmek."],["Canlı görüntü","Ne kadar tuhaf ve hareketliyse o kadar akılda kalır."],["OK platosu","“Yeterince iyi” olunca gelişmenin durması."],["Fotoğrafik hafıza","Yetişkinde kanıtlanmış örnek yok; geliştirilmiş hafıza gerçek."]],
  steps:["Evinde 10 duraklı bir rota belirle.","Her bilgiyi abartılı bir görüntüye çevir.","Görüntüyü durağa yerleştir.","Ertesi gün ve bir hafta sonra rotayı tekrar yürü."]},
 {id:"lockin",s:"zihin",t:"Odak kilidi: derin çalışma",who:"CAL NEWPORT",dur:"2 SA 53 DK",reel:"How to systematically lock in",
  sum:"Cal Newport, Huberman Lab'de odaklanmanın bir yetenek değil, antrenmanla gelişen bir beceri olduğunu anlatıyor. Değerli işler “derin çalışma” ister: dikkat dağılmadan, uzun süre tek bir zor işe odaklanmak. Bunun için günü önceden bloklara bölmek ve işler arası geçişi azaltmak gerekir.",
  terms:[["Derin çalışma","Dikkat dağıtıcısız, zihni sınırına kadar zorlayan odaklı iş."],["Sığ çalışma","E-posta, mesaj gibi kolay ama az değer üreten işler."],["Dikkat kalıntısı","Bir işten ötekine geçince aklın bir kısmının eskide kalması."],["Zaman bloklama","Günün her saatine önceden bir iş atamak."],["Kapanış ritüeli","Günün sonunda işi bilinçli olarak kapatıp zihni boşaltmak."]],
  steps:["Yarının planını bugünden saat saat blokla.","Derin çalışma bloğunda telefonu başka odaya koy.","Mesajlara günde 2-3 sabit saatte bak.","İlk hafta 60 dk ile başla, her hafta biraz uzat.","Gün sonunda yarın için 3 maddelik not yaz ve bilgisayarı kapat."]},
 {id:"dopamin",s:"zihin",t:"Dopamin, haz ve acı dengesi",who:"HUBERMAN · LEMBKE",dur:"~2 SA",reel:"Boring my brain for 10 min so studying feels fun",
  sum:"Psikiyatrist Anna Lembke'ye göre beyindeki haz ve acı bir terazinin iki kefesi gibi çalışır. Telefon, şeker, kısa videolar gibi hızlı hazlar teraziyi bir yöne iter; beyin dengeyi korumak için öbür tarafa acı ekler. Sonuç: ders çalışmak gibi yavaş ödüller sıkıcı gelir. Sıkılmaya izin vermek terazinin yeniden dengelenmesine yardım eder.",
  terms:[["Haz-acı terazisi","Her hazdan sonra beyin dengeyi geri getirmek için acı tarafına ağırlık koyar."],["Tolerans","Aynı hazzı almak için gittikçe daha fazlasına ihtiyaç duymak."],["Dopamin orucu","Bir süre yoğun haz kaynağından uzak durup dengenin dönmesini beklemek."],["Kendini bağlama","Kendine engeller koymak: uygulamayı silmek, telefonu kilitlemek."],["Sıkılma","Kaçılacak bir şey değil; beynin sıfırlandığı an."]],
  steps:["Çalışmadan önce 10 dakika uyaransız otur: telefon yok, müzik yok.","Seni en çok çeken bir hızlı hazzı seç ve bir hafta ondan uzak dur.","Telefonu çalışırken başka odaya koy ya da uygulamaları kilitle.","Ödülü işin sonuna koy, başına değil.","Bir hafta sonra ders çalışmanın nasıl geldiğini not et."]},

const STATES = [["izlenecek","İZLENECEK"],["izlendi","İZLENDİ"],["uygulaniyor","UYGULANIYOR"]];
const store = (()=>{let d={};try{d=JSON.parse(localStorage.getItem("udaio-demo")||"{}")}catch(e){}
  return {get:(k,f)=>k in d?d[k]:f,set:(k,v)=>{d[k]=v;try{localStorage.setItem("udaio-demo",JSON.stringify(d))}catch(e){}}}})();
const status = id => store.get("s:"+id,"izlenecek");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sec = id => S.find(x=>x.id===id);
let cur = {sec:store.get("sec","ai"),note:null};
if(!sec(cur.sec))cur.sec="ai";

function pix(cv,seed,color,dark){
  const w=48,h=21; cv.width=w; cv.height=h; const x=cv.getContext("2d");
  let r=seed*9301+49297; const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  x.fillStyle=color; x.fillRect(0,0,w,h);
  x.fillStyle="rgba(8,17,12,.16)"; for(let i=0;i<70;i++){x.fillRect(Math.floor(rnd()*w),Math.floor(rnd()*h),1,1)}
  x.fillStyle=dark?"rgba(233,238,223,.28)":"rgba(233,238,223,.55)";
  for(let i=0;i<5;i++){const bx=Math.floor(rnd()*(w-8)),by=Math.floor(rnd()*(h-6));x.fillRect(bx,by,Math.floor(3+rnd()*6),Math.floor(2+rnd()*3))}
  x.fillStyle=dark?"#1F3A2D":"#10201A"; const k=Math.floor(rnd()*3);
  if(k===0){for(let i=0;i<w;i+=4)x.fillRect(i,h-3-Math.floor(rnd()*5),3,6)}
  else if(k===1){x.fillRect(4,h-4,w-8,1);for(let i=0;i<6;i++)x.fillRect(6+i*7,h-6-Math.floor(rnd()*8),4,1)}
  else{for(let i=0;i<4;i++){const cx=8+i*11,cy=6+Math.floor(rnd()*8);x.fillRect(cx,cy,3,3)}x.fillRect(9,h-5,w-18,1)}
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let qi=Math.floor(Math.random()*QUOTES.length), qtimer;
function showQuote(){const el=document.getElementById("qtext");el.textContent=QUOTES[qi];el.classList.remove("in");void el.offsetWidth;el.classList.add("in")}
function nextQuote(){qi=(qi+1)%QUOTES.length;showQuote();clearInterval(qtimer);qtimer=setInterval(nextQuote,9000)}

function renderSide(){
  document.getElementById("side").innerHTML='<span class="lab">Bölümler</span>'+S.map(s=>
    `<button class="nav blk" type="button" data-sec="${s.id}" style="--c:var(${s.c})" ${cur.sec===s.id?'aria-current="page"':""}>
      <span class="ico" aria-hidden="true">${s.ico}</span><span class="nn">${esc(s.name)}</span></button>`).join("");
}
function renderProgress(){
  const done=N.filter(n=>status(n.id)==="uygulaniyor").length;
  document.getElementById("qnum").textContent=done+"/"+N.length;
  document.getElementById("qfill").style.width=(done/N.length*100)+"%";
}
function renderSection(){
  const s=sec(cur.sec), p=document.getElementById("panel");
  p.style.setProperty("--c",`var(${s.c})`);
  const notes=N.filter(n=>n.s===s.id);
  p.innerHTML=`<div class="bar"><span class="tab lab">${esc(s.name)}</span><span class="crumb lab">Udaio / ${esc(s.name)}</span></div>
  <div class="body">
    <div class="hero"><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div>
    ${notes.length?"":`<div class="empty">Bu bölümün ilk notu, aşağıdaki konulardan biri için video seçilince eklenecek.</div>`}
    <div class="grid">${notes.map((n,i)=>`<button class="card blk" type="button" data-note="${n.id}">
      <span class="cth"><canvas data-seed="${i+3+n.id.length}" aria-hidden="true"></canvas><span class="who">${esc(n.who)}</span><span class="dur">${esc(n.dur)}</span></span>
      <span class="ci"><span class="ct">${esc(n.t)}</span><span class="cs">${esc(n.sum)}</span>
      <span class="cf"><span class="st" data-s="${status(n.id)}">${STATES.find(x=>x[0]===status(n.id))[1]}</span><span class="go">AÇ ►</span></span></span></button>`).join("")}</div>
    ${s.soon&&s.soon.length?`<div class="soon"><h3 class="lab">Sıradaki konular</h3><div class="soonl">${s.soon.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`:""}
  </div>`;
  const col=cssv(s.c);
  p.querySelectorAll("canvas").forEach(c=>pix(c,+c.dataset.seed,col,false));
}
function renderNote(){
  const n=N.find(x=>x.id===cur.note), s=sec(n.s), p=document.getElementById("panel");
  p.style.setProperty("--c",`var(${s.c})`);
  const done=store.get("c:"+n.id,[]);
  p.innerHTML=`<div class="bar"><span class="tab lab">${esc(s.name)}</span><span class="crumb lab">Udaio / ${esc(s.name)} / Not</span></div>
  <div class="body">
    <button class="back blk lab" type="button" data-back>◄ Geri</button>
    <div class="hero"><span class="eyebrow lab">${esc(n.who)} · ${esc(n.dur)}</span><h2>${esc(n.t)}</h2></div>
    <div class="nhead">
      <div class="screen"><canvas id="scr" aria-hidden="true"></canvas><span class="demo lab">Demo</span><span class="play">${n.noVideo?"VİDEO HENÜZ SEÇİLMEDİ":"► VİDEO BURADA OYNAYACAK"}</span></div>
      <div class="meta">
        <div class="mrow"><span class="k lab">Kaynak Reel</span><span class="v">${esc(n.reel)}</span></div>
        <div class="mrow"><span class="k lab">Durum</span><div class="seg" role="group" aria-label="Durum">${STATES.map(x=>`<button type="button" data-st="${x[0]}" aria-pressed="${status(n.id)===x[0]}">${x[1]}</button>`).join("")}</div></div>
        <p class="warnline">Not, transkriptten henüz doğrulanmadı.</p>
      </div>
    </div>
    <div class="secs">
      <section class="sec"><h3 class="lab"><i>1</i>Kısa özet</h3><div class="sb"><p>${esc(n.sum)}</p></div></section>
      <section class="sec"><h3 class="lab"><i>2</i>Ana kavramlar</h3><div class="sb"><dl class="terms">${n.terms.map(t=>`<div class="term"><dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd></div>`).join("")}</dl></div></section>
      <section class="sec"><h3 class="lab"><i>3</i>Nasıl uygulanır</h3><div class="sb"><ul class="steps">${n.steps.map((t,i)=>`<li><label class="step"><input type="checkbox" id="st-${n.id}-${i}" data-i="${i}" ${done.includes(i)?"checked":""}><span>${esc(t)}</span></label></li>`).join("")}</ul></div></section>
      ${n.ev?`<section class="sec"><h3 class="lab"><i>!</i>Kanıt durumu</h3><div class="sb"><div class="evid">${n.ev.map(e=>`<div class="ev"><span class="lv ${e[0]}">${e[1]}</span><span>${esc(e[2])}</span></div>`).join("")}</div></div></section>`:""}
    </div>
  </div>`;
  pix(document.getElementById("scr"),n.id.length*7,cssv("--screen"),true);
}
function render(){renderSide();renderProgress();cur.note?renderNote():renderSection()}

document.getElementById("quote").addEventListener("click",nextQuote);
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-sec]");
  if(nav){cur={sec:nav.dataset.sec,note:null};store.set("sec",cur.sec);render();
    const b=document.querySelector(`[data-sec="${cur.sec}"]`); b&&b.scrollIntoView({inline:"nearest",block:"nearest"});return}
  const card=e.target.closest("[data-note]");
  if(card){cur.note=card.dataset.note;render();document.getElementById("panel").scrollIntoView({block:"start"});return}
  if(e.target.closest("[data-back]")){cur.note=null;render();return}
  const st=e.target.closest("[data-st]");
  if(st){store.set("s:"+cur.note,st.dataset.st);render();return}
});
document.addEventListener("change",e=>{
  const cb=e.target.closest(".step input"); if(!cb)return;
  const k="c:"+cur.note; let d=store.get(k,[]); const i=+cb.dataset.i;
  d=cb.checked?[...new Set([...d,i])]:d.filter(x=>x!==i); store.set(k,d);
  const n=N.find(x=>x.id===cur.note);
  if(d.length===n.steps.length&&status(n.id)!=="uygulaniyor"){store.set("s:"+n.id,"uygulaniyor");render()}
});
showQuote(); qtimer=setInterval(nextQuote,9000);
render();
</script>
