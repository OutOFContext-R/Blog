<title>Udaio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Euiro iskeleti (üst bar · solda blok menü · ortada panel), koyu yeşil zemin üstünde mat bölüm renkleri.
   Tek bilinçli görünüm: koyu yeşil; bütün renkler açıkça tanımlı. Tek yazı tipi: Pixelify Sans (logodaki matematik U hariç).
   Telefonda menü yatay şerit olur, sayfa normal kayar. */
:root{
  --bg:#13241C; --bg-dot:#1C3329; --paper:#1A2F25; --paper-2:#21392D; --ink:#E9EEDF; --on-c:#10201A; --edge:#08110C;
  --muted:#A7B8A3; --line:#2F4A3C; --soft:#7D937D;
  --c-ai:#86ABC2; --c-zihin:#97BA8F; --c-founder:#D6B267; --c-psiko:#CC937F; --c-meta:#A595C4; --c-time:#83BCAD; --c-metacog:#D9A877;
  --logo:#A8D8F0; --logo-deep:#0E2A3A;
  --ok:#A9CF8F; --mid:#E3CB7A; --warn:#DE9C88;
  --screen:#0C1812;
  --f:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-math:Georgia,"Times New Roman",serif;
  --bw:3px; --sh:0 4px 0 var(--edge);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.3px,transparent 1.4px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--logo);outline-offset:3px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:16px;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blk{border:var(--bw) solid var(--edge);box-shadow:var(--sh);border-radius:0}
button.blk,a.blk{cursor:pointer;transition:transform .06s}
button.blk:active,a.blk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.lab{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* ÜST BAR */
.top{display:flex;align-items:stretch;gap:12px;min-width:0}
.logo{background:var(--logo);color:var(--logo-deep);display:flex;align-items:center;gap:12px;padding:8px 16px 8px 10px;flex:none}
.logo .m{width:38px;height:38px;background:var(--logo-deep);color:var(--logo);display:grid;place-items:center;
  font-family:var(--f-math);font-style:italic;font-size:30px;line-height:1;padding-right:3px}
.logo h1{margin:0;font-weight:700;font-size:clamp(20px,2.6vw,26px);line-height:1.2;letter-spacing:.1em;text-shadow:2px 2px 0 rgba(255,255,255,.45)}
.quote{flex:1;min-width:0;position:relative;background:var(--paper);overflow:hidden;display:flex;align-items:center;text-align:left;padding:0;cursor:pointer}
.quote .fill{position:absolute;inset:0 auto 0 0;background:rgba(151,186,143,.28);border-right:3px solid var(--c-zihin);transition:width .4s}
.quote .qt{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px}
.quote .q{flex:1;min-width:0;font-size:16px;line-height:1.35;text-wrap:balance}
.quote .q.in{animation:qin .4s ease-out}
@keyframes qin{from{opacity:0;transform:translateY(6px)}}
.quote b{flex:none;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:var(--c-zihin);white-space:nowrap}

/* SAHNE */
.stage{display:grid;grid-template-columns:228px minmax(0,1fr);gap:18px;align-items:start}
.stage > *{min-width:0}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:11px}
.side .lab{color:var(--muted);padding-left:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;text-align:left;background:var(--paper);min-width:0;position:relative}
.nav .ico{width:28px;height:28px;flex:none;display:grid;place-items:center;background:var(--edge);color:var(--c);font-weight:700;font-size:14px}
.nav .nn{font-weight:600;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav[aria-current="page"]{background:var(--c);color:var(--on-c)}
.nav[aria-current="page"]::after{content:"";position:absolute;right:10px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--on-c)}

/* PANEL */
.panel{background:var(--paper);border:var(--bw) solid var(--edge);box-shadow:0 6px 0 var(--edge);min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--paper-2);border-bottom:var(--bw) solid var(--edge)}
.tab{padding:1px 9px;border:var(--bw) solid var(--edge);background:var(--c);color:var(--on-c)}
.crumb{color:var(--soft);margin-left:auto}
.body{padding:22px 22px 28px;display:grid;gap:22px}
.body > *{min-width:0}

.hero{display:grid;gap:8px;max-width:64ch}
.eyebrow{color:var(--muted)}
.hero h2{margin:0;font-weight:700;font-size:clamp(28px,3.6vw,40px);line-height:1.08;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:17.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;background:var(--paper-2);padding:0;min-width:0}
.card .cth{position:relative;aspect-ratio:16/7;max-width:100%;background:var(--c);border-bottom:var(--bw) solid var(--edge);overflow:hidden}
.card .cth canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.card .cth .dur,.card .cth .who{position:absolute;bottom:8px;font-weight:600;font-size:12px;letter-spacing:.05em;padding:0 6px;border:2px solid var(--edge)}
.card .cth .dur{right:8px;background:var(--edge);color:var(--ink)}
.card .cth .who{left:8px;background:var(--ink);color:var(--on-c);max-width:calc(100% - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ci{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.card .ct{font-weight:600;font-size:20px;line-height:1.2}
.card .cs{font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cf{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:2px}
.go{font-weight:600;font-size:14px;color:var(--c)}

/* NOT SAYFASI */
.back{justify-self:start;padding:4px 12px;background:var(--paper-2)}
.nhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
.nhead > *{min-width:0}
.screen{background:var(--screen);border:var(--bw) solid var(--edge);box-shadow:var(--sh);aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;display:grid;place-items:center;align-content:center;gap:10px;padding:12px;text-align:center}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.6}
.screen .play{position:relative;display:inline-block;background:var(--c);color:var(--on-c);padding:8px 14px;font-weight:600;font-size:15px;letter-spacing:.05em;text-decoration:none}
.screen.embed{padding:0}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.screen small{position:relative;color:var(--muted);font-size:14px;max-width:34ch}
.meta{display:grid;gap:10px;align-content:start}
.mrow{display:grid;gap:4px;padding:10px 12px;border:2px solid var(--edge);background:var(--paper-2)}
.mrow .k{color:var(--soft)}
.mrow .v{font-size:15.5px;line-height:1.4;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-weight:600;font-size:12px;letter-spacing:.05em;padding:2px 8px;border:2px solid var(--edge);background:var(--paper);cursor:pointer;box-shadow:0 2px 0 var(--edge)}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--on-c)}
.tabs{display:flex;gap:0;border:var(--bw) solid var(--edge);box-shadow:var(--sh);justify-self:start;max-width:100%}
.tabs button{font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:8px 22px;border:0;background:var(--paper-2);color:var(--muted);cursor:pointer}
.tabs button+button{border-left:var(--bw) solid var(--edge)}
.tabs button[aria-selected="true"]{background:var(--c);color:var(--on-c)}
.gonotes{background:var(--c);color:var(--on-c);padding:8px 12px;text-align:center}
.ytl{position:relative;color:var(--muted);font-size:13px;text-decoration:underline}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.exs li{display:grid;gap:3px;padding:10px 12px;border-left:4px solid var(--c);background:var(--paper)}
.exs b{font-weight:600;font-size:16px;color:var(--c)}
.exs span{font-size:16px;line-height:1.5;color:var(--ink)}
.warnline{margin:0;font-size:14.5px;color:var(--muted);border-left:4px solid var(--line);padding-left:10px}

.secs{display:grid;gap:18px;max-width:780px}
.sec{border:var(--bw) solid var(--edge);background:var(--paper-2);box-shadow:var(--sh)}
.sec > h3{margin:0;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:var(--bw) solid var(--edge);background:var(--paper)}
.sec > h3 i{font-style:normal;background:var(--c);color:var(--on-c);padding:0 7px}
.sec .sb{padding:14px 16px 16px}
.sec .sb p{margin:0;font-size:17.5px;line-height:1.6}
.terms{margin:0;display:grid;gap:10px}
.term{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:4px 14px;padding-bottom:10px;border-bottom:2px dotted var(--line)}
.term:last-child{border-bottom:0;padding-bottom:0}
.term dt{font-weight:600;font-size:17.5px;line-height:1.3;color:var(--c)}
.term dd{margin:0;font-size:16px;color:var(--muted);line-height:1.5}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;cursor:pointer;padding:8px 10px;border:2px solid var(--line);background:var(--paper)}
.step input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:var(--bw) solid var(--edge);background:var(--paper-2);display:grid;place-items:center;cursor:pointer}
.step input:checked{background:var(--c-zihin)}
.step input:checked::after{content:"";width:10px;height:10px;background:var(--on-c)}
.step span{font-size:16.5px;line-height:1.45}
.step:has(input:checked){border-color:var(--edge)}
.step:has(input:checked) span{color:var(--soft);text-decoration:line-through;text-decoration-thickness:1px}
.evid{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:16px}
.ev .lv{font-weight:600;font-size:12px;letter-spacing:.05em;padding:0 6px;border:2px solid var(--edge);white-space:nowrap;color:var(--on-c)}
.lv.y{background:var(--ok)}.lv.m{background:var(--mid)}.lv.n{background:var(--warn)}

@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:9px;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
  .side::-webkit-scrollbar{display:none}
  .side > *{flex:none;scroll-snap-align:start}
  .side .lab{display:none}
  .nav{padding:7px 10px}
  .nav .nn{font-size:16px}
  .nav[aria-current="page"]::after{content:none}
  .nhead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .app{gap:12px;padding-block:12px 32px}
  .top{flex-wrap:wrap}
  .logo{flex:1 1 100%;justify-content:flex-start}
  .quote{flex:1 1 100%;min-height:58px}
  .body{padding:16px 14px 22px;gap:18px}
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .term{grid-template-columns:minmax(0,1fr)}
  .crumb{display:none}
  .sec .sb{padding:12px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo blk"><span class="m" aria-hidden="true">U</span><h1>UDAIO</h1></div>
    <button class="quote blk" id="quote" type="button" aria-label="Sonraki motivasyon sözü">
      <span class="fill" id="qfill"></span>
      <span class="qt"><span class="q" id="qtext"></span></span>
    </button>
  </header>

  <div class="stage">
    <nav class="side" id="side" aria-label="Bölümler"></nav>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
</div>

  terms:[["Token","Modelin metni okuduğu küçük parçalar; kelime değil."],["Bağlam penceresi","Modelin çalışma belleği. Doldukça eski kısımlara daha az odaklanır."],["Bilgi kesim tarihi","Eğitimden sonrasını bilmez; güncel bilgi için arama gerekir."],["Düşünen modeller","Cevaptan önce düşünür; kod, matematik ve zor problemlerde daha iyi."],["LLM Konseyi","Önemli kararda aynı soruyu birkaç modele sorup karşılaştırmak."]],

 {id:"deepdive",s:"ai",t:"LLM'lerin içi: derin dalış",who:"ANDREJ KARPATHY",dur:"3 SA 31 DK",v:"7xTGNNLPyMI",reel:"AI bölümü, LLM mekanikleri",

  sum:"Kod bilmeden Claude'a çalışan bir oyun yaptırabilirsin. Claude oyunu tek bir sayfa olarak yazar ve sohbetin içinde hemen çalıştırır. İşin sırrı, oyunu tek seferde istemek değil, küçük adımlarla büyütmek: önce oynanabilir en basit hali, sonra tek tek özellik.",

 {id:"noro",s:"zihin",t:"Beynin her gün değişiyor: nöroplastisite",who:"LARA BOYD · TEDX",dur:"14 DK",v:"LNHBMFCzznE",reel:"Dear men… study Neuroplasticity",
  sum:"Beyin araştırmacısı Dr. Lara Boyd, öğrendiğin her şeyin beynini fiziksel olarak değiştirdiğini anlatıyor. Değişim üç yolla olur: kimyasal (kısa süreli), yapısal ve işlevsel (kalıcı). Kalıcı değişimin tek sürücüsü davranıştır: pratik. Herkesin beyni farklı öğrenir; zorlanmak ve yavaş ilerlemek, değişimin gerçekten olduğunun işaretidir.",
  terms:[["Nöroplastisite","Beynin deneyimle kendini yeniden yapılandırması."],["Kimyasal değişim","Hücreler arası sinyal artar; kısa süreli hafızayı destekler."],["Yapısal değişim","Bağlantılar fiziksel olarak değişir; uzun süreli öğrenme."],["İşlevsel değişim","Bir beceri için kullanılan beyin bölgesi daha kolay çalışır hale gelir."],["Bireysel öğrenme","Herkese uyan tek bir öğrenme yolu yok."]],
  steps:["Öğrenmek istediğin bir beceriyi seç ve her gün kısa da olsa pratik yap.","Zorlandığında bırakma; zorluk yapısal değişimin habercisi.","Hangi çalışma biçiminin sana yaradığını bir hafta not et.","İlerlemeyi haftalık ölç; günlük dalgalanmaya takılma."]},
 {id:"hafiza",s:"zihin",t:"Hafıza sarayı",who:"JOSHUA FOER · TED",dur:"20 DK",v:"U6PoUg7jXsA",reel:"3 Ways To Develop a Photographic Memory",
  sum:"Hafıza şampiyonları dahi değil; 2.500 yıllık bir teknik kullanıyorlar. Beynimiz soyut bilgiyi değil, mekânları ve canlı görüntüleri çok iyi hatırlar. Joshua Foer bir yıl çalışıp ABD Hafıza Şampiyonası'nı kazandı.",
  terms:[["Hafıza sarayı","Bilgiyi iyi bildiğin bir mekâna zihninde yerleştirmek."],["Canlı görüntü","Ne kadar tuhaf ve hareketliyse o kadar akılda kalır."],["OK platosu","“Yeterince iyi” olunca gelişmenin durması."],["Fotoğrafik hafıza","Yetişkinde kanıtlanmış örnek yok; geliştirilmiş hafıza gerçek."]],
  steps:["Evinde 10 duraklı bir rota belirle.","Her bilgiyi abartılı bir görüntüye çevir.","Görüntüyü durağa yerleştir.","Ertesi gün ve bir hafta sonra rotayı tekrar yürü."]},
 {id:"lockin",s:"zihin",t:"Odak kilidi: derin çalışma",who:"PRODUCTIVITY GAME",dur:"ANİMASYON",q:"Productivity Game Success in a distracted world DEEP WORK by Cal Newport",reel:"How to systematically lock in",
  sum:"Cal Newport'un Deep Work kitabının animasyonlu özeti. Newport, odaklanmanın bir yetenek değil, antrenmanla gelişen bir beceri olduğunu anlatıyor. Değerli işler “derin çalışma” ister: dikkat dağılmadan, uzun süre tek bir zor işe odaklanmak. Bunun için günü önceden bloklara bölmek ve işler arası geçişi azaltmak gerekir.",
  terms:[["Derin çalışma","Dikkat dağıtıcısız, zihni sınırına kadar zorlayan odaklı iş."],["Sığ çalışma","E-posta, mesaj gibi kolay ama az değer üreten işler."],["Dikkat kalıntısı","Bir işten ötekine geçince aklın bir kısmının eskide kalması."],["Zaman bloklama","Günün her saatine önceden bir iş atamak."],["Kapanış ritüeli","Günün sonunda işi bilinçli olarak kapatıp zihni boşaltmak."]],
  steps:["Yarının planını bugünden saat saat blokla.","Derin çalışma bloğunda telefonu başka odaya koy.","Mesajlara günde 2-3 sabit saatte bak.","İlk hafta 60 dk ile başla, her hafta biraz uzat.","Gün sonunda yarın için 3 maddelik not yaz ve bilgisayarı kapat."]},
 {id:"dopamin",s:"zihin",t:"Dopamin: zor işi sevdirmek",who:"KURGULU VİDEO",dur:"YOUTUBE",v:"H9G9h1kJXa4",reel:"Boring my brain for 10 min so studying feels fun",
  sum:"“How to Make Hard Work ADDICTIVE” videosu, beynin neden kolay ve hızlı ödüllü işlere çekildiğini ve çalışmayı nasıl daha çekici hale getirebileceğini anlatıyor. Psikiyatrist Anna Lembke'nin modeline göre haz ve acı bir terazinin iki kefesi gibi çalışır. Telefon, şeker, kısa videolar gibi hızlı hazlar teraziyi bir yöne iter; beyin dengeyi korumak için öbür tarafa acı ekler. Sonuç: ders çalışmak gibi yavaş ödüller sıkıcı gelir. Sıkılmaya izin vermek terazinin yeniden dengelenmesine yardım eder.",
  terms:[["Haz-acı terazisi","Her hazdan sonra beyin dengeyi geri getirmek için acı tarafına ağırlık koyar."],["Tolerans","Aynı hazzı almak için gittikçe daha fazlasına ihtiyaç duymak."],["Dopamin orucu","Bir süre yoğun haz kaynağından uzak durup dengenin dönmesini beklemek."],["Kendini bağlama","Kendine engeller koymak: uygulamayı silmek, telefonu kilitlemek."],["Sıkılma","Kaçılacak bir şey değil; beynin sıfırlandığı an."]],
  steps:["Çalışmadan önce 10 dakika uyaransız otur: telefon yok, müzik yok.","Seni en çok çeken bir hızlı hazzı seç ve bir hafta ondan uzak dur.","Telefonu çalışırken başka odaya koy ya da uygulamaları kilitle.","Ödülü işin sonuna koy, başına değil.","Bir hafta sonra ders çalışmanın nasıl geldiğini not et."]},
 {id:"theater",s:"zihin",t:"Zihnin tiyatrosu: imgeleme",who:"MAXWELL MALTZ",dur:"YOUTUBE",q:"Psycho-Cybernetics theater of the mind Maxwell Maltz",reel:"Theater of Mind",
  sum:"Plastik cerrah Maxwell Maltz, 1960 tarihli Psycho-Cybernetics kitabında “zihnin tiyatrosu” tekniğini anlatıyor: olmak istediğin kişiyi ve yapmak istediğin şeyi her gün zihninde bir film gibi, bütün ayrıntılarıyla oynatmak. Ona göre davranışlarımızı “kendilik imajımız” belirler ve bu imaj tekrarlanan zihinsel provalarla değişebilir.",
  terms:[["Kendilik imajı","Kendin hakkında inandığın resim; davranışlarının sınırını çizer."],["Zihinsel film","Bir sahneyi gözlerin kapalı, sesleriyle ve hisleriyle ayrıntılı canlandırmak."],["Zihinsel prova","Gerçekte yapmadan önce bir hareketi ya da konuşmayı zihinde tekrar etmek."],["Başarı mekanizması","Maltz'a göre zihin, hedef verilince ona doğru kendiliğinden yön bulur."]],
  steps:["Her gün 10-15 dakika sessiz bir yerde gözlerini kapat.","Yarın yapacağın zor bir şeyi (sunum, antrenman) baştan sona canlandır.","Sesleri, ortamı ve hissi de ekle; sadece sonucu değil süreci izle.","Bir hata yapıp toparlandığın sahneyi de prova et.","Gerçek denemeden sonra filmi gerçeğe göre güncelle."],
  ev:[["y","DESTEKLİ","Zihinsel prova, beden hareketlerinde performansı bir miktar artırabiliyor."],["n","İDDİA","“Beyin hayal ile gerçeği ayırt edemez” sözü abartılı."]]},
 {id:"disiplin",s:"zihin",t:"Öz disiplin",who:"HEALTHYGAMERGG",dur:"YOUTUBE",q:"HealthyGamerGG Why You're Struggling With Discipline",reel:"6 Practices to become Dangerously Powerful",
  sum:"Öz disiplin, o an istediğin şey yerine uzun vadede istediğin şeyi seçebilmektir. Disiplinli görünen insanlar daha çok irade kullanmıyor; ortamlarını, alışkanlıklarını ve kimliklerini buna göre kuruyorlar. Beyin anlık ödülü sever; disiplin bu hesabı değiştiren bir sistemdir.",
  terms:[["Öz kontrol","Anlık dürtüye rağmen hedefe uygun davranmak."],["Ortam tasarımı","Doğru davranışı kolay, yanlışı zor hale getirmek."],["Kimlik temelli alışkanlık","“Spor yapmalıyım” yerine “ben spor yapan biriyim” demek."],["Uygulama niyeti","“Saat 7'de, masada, 30 dk okuyacağım” gibi net plan."],["Kendine verilen söz","Küçük sözleri tutmak kendine güveni büyütür."]],
  steps:["Her gün tutabileceğin çok küçük bir söz ver ve tut.","Dikkat dağıtan şeyleri gözün görmediği yere kaldır.","Yeni bir alışkanlığı saat ve yerle birlikte yaz.","Kaçırdığın bir günden sonra iki gün üst üste kaçırma.","Her akşam “bugün kim olduğumu kanıtladım mı?” diye sor."]},
 {id:"pattern",s:"zihin",t:"Örüntü tanıma ve uzmanlık",who:"VERITASIUM",dur:"YOUTUBE",v:"5eW6Eagr9XA",reel:"Dear men… study Pattern recognition",
  sum:"Veritasium'un “The Expert Myth” videosu, uzmanlığın doğuştan zekâdan değil, binlerce tekrarla kurulan örüntü tanımadan geldiğini anlatıyor. Satranç ustaları genel olarak daha iyi hafızaya sahip değil; ama gerçek oyun pozisyonlarını parçalar halinde bir bakışta tanıyorlar. Bu ancak dört koşul varsa olur: düzenli bir ortam, çok tekrar, hızlı geri bildirim ve konfor alanının dışında pratik.",
  terms:[["Örüntü tanıma","Daha önce gördüğün yapıları yeni durumda hızla fark etmek."],["Parçalama (chunking)","Çok bilgiyi tek anlamlı parça olarak hatırlamak."],["Geçerli ortam","Kuralları ve düzenleri olan alan; satranç gibi."],["Hızlı geri bildirim","Hatanı hemen görmek; örüntü ancak böyle oturur."],["Bilinçli pratik","Kolay olanı değil, zorlandığın kısmı çalışmak."]],
  steps:["Öğrendiğin alanda hızlı geri bildirim alabileceğin bir alıştırma bul.","Aynı tür problemi kısa sürede çok sayıda çöz.","Yanlışlarını bir deftere yaz ve tekrar et.","Rastgeleliği yüksek alanlarda (borsa gibi) “uzman” sözlerine temkinli yaklaş."]},
 /* ---------- FOUNDER ---------- */
 {id:"jobs",s:"founder",t:"Founder hikayesi: Steve Jobs, Stanford",who:"STEVE JOBS",dur:"15 DK",v:"UF8uR6Z6KLc",reel:"Founder hikayeleri",
  sum:"Steve Jobs, 2005'teki Stanford mezuniyet konuşmasında hayatından üç hikaye anlatıyor. Birincisi noktaları birleştirmek: okulu bıraktıktan sonra merakla girdiği kaligrafi dersi, yıllar sonra Mac'in güzel yazı tiplerine dönüştü. İkincisi sevgi ve kayıp: 30 yaşında kendi kurduğu Apple'dan kovuldu, bu da NeXT ve Pixar'ı doğurdu. Üçüncüsü ölüm: her günü son günün gibi yaşamak. Kapanış: “Stay hungry, stay foolish.”",
  terms:[["Noktaları birleştirmek","Bugünkü merakın yararı ancak geriye bakınca görülür."],["Kovulmak","Jobs'a göre başına gelen en iyi şeydi; yeniden başlangıçtı."],["Sevdiğin işi bulmak","Bulmadıysan aramaya devam et, yetinme."],["Stay hungry, stay foolish","Aç kal, toy kal: öğrenmeyi ve risk almayı bırakma."]],
  steps:["Hayatındaki üç “nokta”yı yaz: bugün işine yarayan beklenmedik deneyimler.","Şu an sadece merak ettiğin için öğrendiğin bir şeyi seç ve devam et.","Bir başarısızlığını yaz ve sana ne kazandırdığını not et.","Kendine sor: bugün son günüm olsa bunu yapar mıydım?"]},
 {id:"oyun",s:"founder",t:"Oyun teorisi: Mahkum İkilemi",who:"VERITASIUM",dur:"27 DK",v:"mScpHTIi-kM",reel:"Dear men… study Game theory",
  sum:"Tek seferlik oyunda ihanet cazip görünür ama ikisi de ihanet edince ikisi de kaybeder. Axelrod'un turnuvalarında en basit strateji kazandı: önce iyi ol, sonra karşının yaptığını yap. Tekrarlanan oyunda işbirliği kazanır.",
  terms:[["Mahkum İkilemi","Tek başına mantıklı olan, birlikte kötü sonuç verir."],["Tit for Tat","Önce işbirliği yap, sonra karşının önceki hamlesini tekrarla."],["4 özellik","İyi, affedici, misilleme yapan, açık."],["Sıfır toplamlı değil","Pastayı büyütmek mümkündür."]],
  steps:["İş ilişkilerini tekrarlanan oyun gibi gör.","İlk adımda iyi niyetli ol, sınırların net olsun.","Bir yanlış anlamada bir şans daha ver.","Bu hafta bir kararını oyun gibi analiz et."]},
 {id:"obsession",s:"founder",t:"Takıntı: dahiliğin otobüs bileti teorisi",who:"PAUL GRAHAM",dur:"MAKALE",url:"http://paulgraham.com/genius.html",urlLabel:"MAKALEYİ OKU",reel:"Dear men… study Obsession",
  sum:"Y Combinator'ın kurucusu Paul Graham'a göre büyük işler üç şeyden doğar: yetenek, sıkı çalışma ve bir konuya duyulan takıntılı ilgi. Çocukların otobüs bileti biriktirmesi gibi, bu ilgi çoğu zaman “işe yaramaz” görünür ve para ya da ün için değil, konunun kendisi için duyulur. En büyük keşifler bu çıkarsız merakla gelir.",
  terms:[["Otobüs bileti teorisi","Değersiz görünen bir şeye duyulan derin, çıkarsız ilgi."],["Çıkarsız takıntı","Ödül için değil, konunun kendisi için kazmak."],["Sıkı çalışma","Takıntı, yorulmadan çok çalışmayı mümkün kılar."],["Erken işaret","Kimsenin önemsemediği bir şeye uzun süre ilgi duymak."]],
  steps:["Kimse sormasa da üzerine saatlerce konuşabileceğin bir konu yaz.","Bu hafta o konuya ödülsüz 3 saat ayır.","İlginin seni nereye götürdüğünü not et.","Başkalarının “gereksiz” dediği bir merakı hemen bırakma."]},
 {id:"range",s:"founder",t:"Doğrusal olmayan kariyer: Range",who:"DAVID EPSTEIN · TED",dur:"TED",q:"David Epstein Why specializing early doesn't always mean career success TED",reel:"Dear men… study Non-linear careers",
  sum:"David Epstein, Range kitabında erken uzmanlaşmanın her alanda en iyi yol olmadığını gösteriyor. Tiger Woods küçük yaşta tek bir sporda başladı; Roger Federer ise çocukken birçok spor denedi ve tenise geç odaklandı. Kuralları net alanlarda erken uzmanlaşma işe yarar; ama belirsiz, değişken alanlarda farklı deneyimler toplayan genelciler daha başarılı olur.",
  terms:[["Örnekleme dönemi","Odaklanmadan önce birçok alanı denemek."],["Uyum kalitesi","Kişinin yaptığı işle gerçekten uyuşması."],["Dost ortam","Kuralları ve geri bildirimi net alan; satranç, golf."],["Zorlu ortam","Kuralları belirsiz, değişken alan; iş dünyası, yenilik."],["Analojik düşünme","Bir alandan öğrendiğini başka bir alana taşımak."]],
  steps:["Şu an ilgilendiğin farklı alanları yaz ve aralarındaki bağlantıları ara.","Bu ay tamamen yeni bir alanda küçük bir deneme yap.","Bir problemde başka bir alandan bir çözüm ödünç al.","“Geç kaldım” düşüncesini bırak; geç odaklanmak da bir yol."]},
 {id:"quotes",s:"founder",t:"Founder'lardan motivasyon sözleri",who:"DERLEME",dur:"SÖZLER",reel:"Motivasyon sözleri",noVideo:true,
  sum:"Kurucuların ve yatırımcıların, zor anlarda tekrar edilen sözleri. Her biri bir çalışma biçimini özetliyor: hızlı başlamak, insanların istediğini yapmak, fikirden çok uygulamaya odaklanmak.",
  terms:[["Steve Jobs","“Stay hungry, stay foolish.” (Aç kal, toy kal.)"],["Paul Graham / Y Combinator","“Make something people want.” (İnsanların istediği bir şey yap.)"],["Reid Hoffman","“Ürününün ilk sürümünden utanmıyorsan, çok geç çıkarmışsın.”"],["Scott Belsky","“Mesele fikirler değil, fikirleri hayata geçirmek.”"],["Mark Zuckerberg","“Move fast and break things.” (Facebook'un ilk yıllarındaki iç ilkesi.)"]],
  steps:["Bu hafta için bir söz seç ve telefonunun kilit ekranı yap.","Her sabah o sözü bugünkü bir işe bağla.","Hafta sonunda sözün sana ne yaptırdığını yaz.","Kendi sözünü yaz: senin çalışma ilken ne?"]},

 {id:"voss",s:"psiko",t:"Asla ortada buluşma",who:"CHRIS VOSS",dur:"50 DK",v:"guZa7mQV1l0",reel:"Konuşma becerileri",
  sum:"Eski FBI rehine müzakerecisi Chris Voss'a göre insanlar duyguyla karar verir. İyi bir konuşma, karşıya anlaşıldığını hissettirmekle başlar. Bu teknikler hem iyi konuşmak hem de sana karşı kullanıldığında fark etmek için.",
  terms:[["Taktiksel empati","Karşının duygusunu anlayıp dile getirmek."],["Aynalama","Son 1-3 kelimeyi soru tonuyla tekrar etmek."],["Etiketleme","“Görünüşe göre endişelisin…” diyerek duyguya isim vermek."],["Kalibre sorular","“Ne” ve “nasıl” ile başlayan açık sorular."]],
  steps:["Bir konuşmada sadece aynalama dene.","Tartışmada önce etiketle, sonra sus.","“Neden” yerine “nasıl” sor.","Biri seni hızlı “evet”e itiyorsa yavaşla."]},
 {id:"manip",s:"psiko",t:"Manipülasyon taktiklerini tanımak",who:"DR. RAMANI",dur:"YOUTUBE",q:"Dr. Ramani what is gaslighting",reel:"Manipülasyon (tanıma ve korunma)",
  sum:"Klinik psikolog Dr. Ramani Durvasula, manipülatif ilişkilerde en sık görülen taktikleri anlatıyor. Bunların ortak amacı, karşıdakinin kendi algısından şüphe etmesini ve kontrolün manipülatörde kalmasını sağlamak. Taktiğin adını bilmek, onu fark etmenin ve etkisinden çıkmanın ilk adımı.",
  terms:[["Gaslighting","Yaşadığın şeyi inkâr ederek kendi aklından şüphe ettirmek."],["Love bombing","Başta aşırı ilgi ve övgüyle hızla bağ kurdurmak."],["Suçu çevirme","Kendi hatasını sana yüklemek: “Sen beni buna zorladın.”"],["Üçgenleme","Araya üçüncü birini sokup kıskançlık ve rekabet yaratmak."],["Sessiz ceza","Konuşmamayı cezalandırma aracı olarak kullanmak."]],
  steps:["Olayları olduğu gün kısa notlarla yaz; hafızanı kayda dayandır.","“Bunu gerçekten ben mi yanlış hatırlıyorum?” sorusu sık geliyorsa dur ve fark et.","Güvendiğin birine durumu anlat; dışarıdan bakış iste.","Tartışmayı uzatmak yerine kısa, sakin ve sıkıcı cevaplar ver."]},
 {id:"elicit",s:"psiko",t:"CIA bilgi sızdırma teknikleri",who:"ESKİ CIA SUBAYLARI",dur:"YOUTUBE",q:"Elicitation CIA's technique to make people talk",reel:"CIA sorgu ve etki teknikleri",
  sum:"İstihbaratçılar bilgiyi çoğu zaman doğrudan sormaz. “Elicitation” denen yöntemle, karşıdakinin kendiliğinden anlatmasını sağlarlar: yanlış bir şey söyleyip düzeltilmeyi beklemek, yaklaşık bir sayı verip karşının onu düzeltmesini sağlamak, ya da iltifatla konuşturmak. İnsanların düzeltme, yardım etme ve takdir edilme isteğine dayanır.",
  terms:[["Elicitation","Soru sormadan, cümlelerle bilgi aldırmak."],["Bilerek yanlış söylemek","Karşının düzeltme isteğini tetiklemek."],["Aralık verme","“Sanırım 10 ile 20 arası” deyip net sayıyı aldırmak."],["Karşılıklılık","Önce küçük bir sır verip karşılığında bilgi beklemek."],["Şaşırmış gibi yapmak","“Yok artık, olamaz” diyerek ayrıntı anlattırmak."]],
  steps:["Biri yanlış bir şey söylediğinde her zaman düzeltmek zorunda olmadığını hatırla.","Yeni tanıştığın biri iş ya da para ayrıntısına çok ilgi gösteriyorsa yavaşla.","Bir sohbetten sonra kendine sor: ne anlattım, ne öğrendim?","Bu teknikleri etik sınırlar içinde, iyi dinleyici olmak için kullan."]},
 {id:"mkultra",s:"psiko",t:"MK-Ultra: CIA'nın zihin kontrolü denemesi",who:"BBC REEL",dur:"KISA",q:"BBC Reel MK-Ultra The shocking Cold War experiments hidden by the CIA",reel:"MK-Ultra",
  sum:"MK-Ultra, CIA'nın 1953'te başlattığı gizli bir programdı. Soğuk Savaş korkusuyla sorgu ve zihin kontrolü yöntemleri aranıyordu: LSD gibi uyuşturucular, bazen deneklerin haberi olmadan denendi. 1973'te kayıtların çoğu imha edildi; program 1975'teki Senato soruşturmalarıyla ortaya çıktı. Tarihçilere göre program istediği zihin kontrolünü hiçbir zaman başaramadı.",
  terms:[["Sidney Gottlieb","Programı yöneten CIA kimyageri."],["Bilgisiz denekler","İnsanlara haberleri olmadan madde verilmesi; büyük etik ihlal."],["Kayıt imhası","1973'te belgelerin çoğunun yok edilmesi."],["Church Komitesi","Programı 1975'te kamuya açan Senato soruşturması."]],
  steps:["Bir “gizli program” iddiası duyduğunda belgeye dayalı mı diye sor.","Programın gerçek yanını (deneyler) efsanesinden (başarılı zihin kontrolü) ayır.","Etik sınırların neden önemli olduğunu bu örnek üzerinden not et."],
  ev:[["y","GERÇEK","Program vardı; Senato belgeleriyle kanıtlı."],["n","İDDİA","Başarılı zihin kontrolü sağlandığı ve bugün sürdüğü."]]},

  if(n.v) return {href:"https://www.youtube.com/watch?v="+n.v,label:"► YOUTUBE'DA İZLE",hint:"Video YouTube'da yeni sekmede açılır."};
  if(n.q) return {href:"https://www.youtube.com/results?search_query="+encodeURIComponent(n.q),label:"► YOUTUBE'DA BUL",hint:"Videonun tam başlığıyla YouTube araması açılır."};
  if(n.url) return {href:n.url,label:n.urlLabel||"► KAYNAĞI AÇ",hint:"Kaynak yeni sekmede açılır."};
  return null;
}

function pix(cv,seed,color,dark){
  const w=48,h=21; cv.width=w; cv.height=h; const x=cv.getContext("2d");
  let r=seed*9301+49297; const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  x.fillStyle=color; x.fillRect(0,0,w,h);
  x.fillStyle="rgba(8,17,12,.16)"; for(let i=0;i<70;i++){x.fillRect(Math.floor(rnd()*w),Math.floor(rnd()*h),1,1)}
  x.fillStyle=dark?"rgba(233,238,223,.28)":"rgba(233,238,223,.55)";
  for(let i=0;i<5;i++){const bx=Math.floor(rnd()*(w-8)),by=Math.floor(rnd()*(h-6));x.fillRect(bx,by,Math.floor(3+rnd()*6),Math.floor(2+rnd()*3))}
  x.fillStyle=dark?"#1F3A2D":"#10201A"; const k=Math.floor(rnd()*3);
  if(k===0){for(let i=0;i<w;i+=4)x.fillRect(i,h-3-Math.floor(rnd()*5),3,6)}
  else if(k===1){x.fillRect(4,h-4,w-8,1);for(let i=0;i<6;i++)x.fillRect(6+i*7,h-6-Math.floor(rnd()*8),4,1)}
  else{for(let i=0;i<4;i++){const cx=8+i*11,cy=6+Math.floor(rnd()*8);x.fillRect(cx,cy,3,3)}x.fillRect(9,h-5,w-18,1)}
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let qi=Math.floor(Math.random()*QUOTES.length), qtimer;
function showQuote(){const el=document.getElementById("qtext");el.textContent=QUOTES[qi];el.classList.remove("in");void el.offsetWidth;el.classList.add("in")}
function nextQuote(){qi=(qi+1)%QUOTES.length;showQuote();clearInterval(qtimer);qtimer=setInterval(nextQuote,9000)}

function renderSide(){
  document.getElementById("side").innerHTML='<span class="lab">Bölümler</span>'+S.map(s=>
    `<button class="nav blk" type="button" data-sec="${s.id}" style="--c:var(${s.c})" ${cur.sec===s.id?'aria-current="page"':""}>
      <span class="ico" aria-hidden="true">${s.ico}</span><span class="nn">${esc(s.name)}</span></button>`).join("");
}
function renderProgress(){
  const done=N.filter(n=>status(n.id)==="uygulaniyor").length;
  document.getElementById("qfill").style.width=(done/N.length*100)+"%";
}
function renderSection(){
  const s=sec(cur.sec), p=document.getElementById("panel");
  p.style.setProperty("--c",`var(${s.c})`);
  const notes=N.filter(n=>n.s===s.id);
  p.innerHTML=`<div class="bar"><span class="tab lab">${esc(s.name)}</span><span class="crumb lab">Udaio / ${esc(s.name)}</span></div>
  <div class="body">
    <div class="hero"><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div>
    <div class="grid">${notes.map((n,i)=>`<button class="card blk" type="button" data-note="${n.id}">
      <span class="cth"><canvas data-seed="${i+3+n.id.length}" aria-hidden="true"></canvas><span class="who">${esc(n.who)}</span><span class="dur">${esc(n.dur)}</span></span>
      <span class="ci"><span class="ct">${esc(n.t)}</span><span class="cs">${esc(n.sum)}</span>
      <span class="cf"><span class="go">AÇ ►</span></span></span></button>`).join("")}</div>
  </div>`;
  const col=cssv(s.c);
  p.querySelectorAll("canvas").forEach(c=>pix(c,+c.dataset.seed,col,false));
}
function renderNote(){
  const n=N.find(x=>x.id===cur.note), s=sec(n.s), p=document.getElementById("panel"), L=link(n);
  p.style.setProperty("--c",`var(${s.c})`);
  const done=store.get("c:"+n.id,[]);
  const tab=cur.tab||"video";
  const hasVideo=!n.noVideo;
  let screen;
  if(!hasVideo) screen=`<span class="play blk">SÖZ DERLEMESİ</span><small>Bu konunun videosu yok; sözler Notlar sekmesinde.</small>`;
  else if(EMBED&&n.v) screen=`<iframe src="https://www.youtube-nocookie.com/embed/${esc(n.v)}?rel=0&playsinline=1" title="${esc(n.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  else if(EMBED) screen=`<span class="play blk">VİDEO LİNKİ BEKLENİYOR</span><small>Bu konunun videosu henüz eklenmedi. Linki gelince burada oynayacak.</small>${L?`<a class="ytl" href="${esc(L.href)}" target="_blank" rel="noopener">YouTube'da ara</a>`:""}`;
  else screen=`<a class="play blk" href="${SITE}#${esc(n.id)}" target="_blank" rel="noopener">► SİTEDE İZLE</a><small>Claude yapıtı içinde video oynatılamıyor. Videolar Udaio sitesinde, sayfanın içinde oynar.</small>${L?`<a class="ytl" href="${esc(L.href)}" target="_blank" rel="noopener">YouTube'da aç</a>`:""}`;
  const videoTab=`<div class="nhead">
      <div class="screen${EMBED&&n.v?" embed":""}"><canvas id="scr" aria-hidden="true"></canvas>${screen}</div>
      <div class="meta">
        <div class="mrow"><span class="k lab">Kaynak Reel</span><span class="v">${esc(n.reel)}</span></div>
        <div class="mrow"><span class="k lab">Durum</span><div class="seg" role="group" aria-label="Durum">${STATES.map(x=>`<button type="button" data-st="${x[0]}" aria-pressed="${status(n.id)===x[0]}">${x[1]}</button>`).join("")}</div></div>
        <button class="blk gonotes lab" type="button" data-tab="notes">Notları aç ►</button>
      </div>
    </div>`;
  const notesTab=`<div class="secs">
      <section class="sec"><h3 class="lab"><i>1</i>Açıklama</h3><div class="sb"><p>${esc(n.sum)}</p></div></section>
      <section class="sec"><h3 class="lab"><i>2</i>Nasıl yapılır</h3><div class="sb"><ul class="steps">${n.steps.map((t,i)=>`<li><label class="step"><input type="checkbox" id="st-${n.id}-${i}" data-i="${i}" ${done.includes(i)?"checked":""}><span>${esc(t)}</span></label></li>`).join("")}</ul></div></section>
      ${n.ex?`<section class="sec"><h3 class="lab"><i>3</i>Örnekler</h3><div class="sb"><ul class="exs">${n.ex.map(x=>`<li><b>${esc(x[0])}</b><span>${esc(x[1])}</span></li>`).join("")}</ul></div></section>`:""}
      <section class="sec"><h3 class="lab"><i>4</i>${n.id==="quotes"?"Sözler":"Kavramlar"}</h3><div class="sb"><dl class="terms">${n.terms.map(t=>`<div class="term"><dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd></div>`).join("")}</dl></div></section>
      ${n.ev?`<section class="sec"><h3 class="lab"><i>!</i>Kanıt durumu</h3><div class="sb"><div class="evid">${n.ev.map(e=>`<div class="ev"><span class="lv ${e[0]}">${e[1]}</span><span>${esc(e[2])}</span></div>`).join("")}</div></div></section>`:""}
      <p class="warnline">Notlar, videonun transkriptinden henüz doğrulanmadı.</p>
    </div>`;
  p.innerHTML=`<div class="bar"><span class="tab lab">${esc(s.name)}</span><span class="crumb lab">Udaio / ${esc(s.name)} / Not</span></div>
  <div class="body">
    <button class="back blk lab" type="button" data-back>◄ Geri</button>
    <div class="hero"><span class="eyebrow lab">${esc(n.who)} · ${esc(n.dur)}</span><h2>${esc(n.t)}</h2></div>
    <div class="tabs" role="tablist" aria-label="Not sekmeleri">
      <button type="button" role="tab" data-tab="video" aria-selected="${tab==="video"}">Video</button>
      <button type="button" role="tab" data-tab="notes" aria-selected="${tab==="notes"}">Notlar</button>
    </div>
    ${tab==="video"?videoTab:notesTab}
  </div>`;
  const sc=document.getElementById("scr"); if(sc) pix(sc,n.id.length*7,cssv("--screen"),true);
}
function render(){renderSide();renderProgress();cur.note?renderNote():renderSection()}

document.getElementById("quote").addEventListener("click",nextQuote);
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-sec]");
  if(nav){cur={sec:nav.dataset.sec,note:null};store.set("sec",cur.sec);render();
    const b=document.querySelector(`[data-sec="${cur.sec}"]`); b&&b.scrollIntoView({inline:"nearest",block:"nearest"});return}
  const card=e.target.closest("[data-note]");
  const tb=e.target.closest("[data-tab]");
  if(tb){cur.tab=tb.dataset.tab;render();document.getElementById("panel").scrollIntoView({block:"start"});return}
  if(card){cur.note=card.dataset.note;cur.tab="video";render();document.getElementById("panel").scrollIntoView({block:"start"});return}
  if(e.target.closest("[data-back]")){cur.note=null;render();return}
  const st=e.target.closest("[data-st]");
  if(st){store.set("s:"+cur.note,st.dataset.st);render();return}
});
document.addEventListener("change",e=>{
  const cb=e.target.closest(".step input"); if(!cb)return;
  const k="c:"+cur.note; let d=store.get(k,[]); const i=+cb.dataset.i;
  d=cb.checked?[...new Set([...d,i])]:d.filter(x=>x!==i); store.set(k,d);
  const n=N.find(x=>x.id===cur.note);
  if(d.length===n.steps.length&&status(n.id)!=="uygulaniyor"){store.set("s:"+n.id,"uygulaniyor");render()}
});
showQuote(); qtimer=setInterval(nextQuote,9000);
{ const h=decodeURIComponent(location.hash.slice(1)), hn=N.find(n=>n.id===h); if(hn) cur={sec:hn.s,note:hn.id,tab:"video"}; }
render();
</script>
