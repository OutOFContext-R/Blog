/* Layout: Euiro iskeleti (üst bar · solda blok menü · ortada panel), krem kâğıt üstünde sakin, mat renkler.
   Tek bilinçli görünüm: açık krem; bütün renkler açıkça tanımlı. Telefonda menü yatay şerit olur, sayfa normal kayar. */
:root{
  --bg:#EEE5D0; --bg-dot:#DDD0B3; --paper:#FFFAEF; --paper-2:#F7EFDC; --ink:#2B251D; --edge:#2B251D;
  --muted:#6F6553; --line:#D8CBAE; --soft:#9A8E77;
  --c-ai:#9DBBCF; --c-zihin:#B3C9A3; --c-founder:#E6C27A; --c-psiko:#DBA592; --c-meta:#B3A5CB; --c-reels:#E9DDBF;
  --ok:#BFD8A9; --mid:#F0D98F; --todo:#FFFAEF; --warn:#EBB5A4;
  --screen:#2E2A24; --screen-ink:#EDE3CB;
  --f-pix:"DefterTR","Press Start 2P","Courier New",monospace;
  --f-head:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bw:3px; --sh:0 4px 0 var(--edge);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.2px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:16px;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blk{border:var(--bw) solid var(--edge);box-shadow:var(--sh);border-radius:0}
button.blk,.press{cursor:pointer;transition:transform .06s}
button.blk:active,.press:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}

/* ÜST BAR */
.top{display:flex;align-items:stretch;gap:12px;min-width:0}
.logo{background:var(--c-founder);display:flex;align-items:center;gap:10px;padding:8px 14px;flex:none}
.logo .m{width:30px;height:30px;background:var(--ink);color:var(--c-founder);display:grid;place-items:center;font-family:var(--f-pix);font-size:13px}
.logo h1{margin:0;font-family:var(--f-pix);font-weight:400;font-size:clamp(13px,2vw,18px);line-height:1.6;letter-spacing:.02em}
.week{flex:1;min-width:0;position:relative;background:var(--paper);overflow:hidden;display:flex;align-items:center}
.week .fill{position:absolute;inset:0 auto 0 0;background:var(--c-zihin);transition:width .4s}
.week .wt{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:0 14px;font-family:var(--f-pix);font-size:9px;line-height:2}
.week .wt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.week b{font-weight:400;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.streak{background:var(--paper);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;flex:none}
.streak .fl{width:30px;height:30px;background:var(--c-psiko);border:var(--bw) solid var(--edge);display:grid;place-items:center}
.streak b{display:block;font-family:var(--f-pix);font-weight:400;font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums}
.streak small{display:block;font-family:var(--f-pix);font-size:7px;line-height:1.8;color:var(--muted)}

/* SAHNE */
.stage{display:grid;grid-template-columns:232px minmax(0,1fr);gap:18px;align-items:start}
.stage > *{min-width:0}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:11px}
.side .lbl{font-family:var(--f-pix);font-size:7px;line-height:2;color:var(--muted);padding-left:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;text-align:left;background:var(--paper);min-width:0;position:relative}
.nav .ico{width:26px;height:26px;flex:none;display:grid;place-items:center;background:var(--edge);color:var(--paper);font-family:var(--f-pix);font-size:9px}
.nav .nt{display:grid;min-width:0}
.nav .nn{font-family:var(--f-head);font-weight:600;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .nc{font-family:var(--f-pix);font-size:7px;line-height:2;color:var(--muted)}
.nav[aria-current="page"]{background:var(--c)}
.nav[aria-current="page"] .nc{color:var(--ink)}
.nav[aria-current="page"]::after{content:"";position:absolute;right:10px;top:50%;width:8px;height:8px;margin-top:-4px;background:var(--edge)}
.tip{background:var(--paper-2);border:var(--bw) dashed var(--line);padding:10px 12px;font-size:13px;color:var(--muted)}
.tip b{display:block;font-family:var(--f-pix);font-weight:400;font-size:7px;line-height:2;color:var(--ink)}

/* PANEL */
.panel{background:var(--paper);border:var(--bw) solid var(--edge);box-shadow:0 6px 0 var(--edge);min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--paper-2);border-bottom:var(--bw) solid var(--edge)}
.tab{font-family:var(--f-pix);font-size:9px;line-height:2;padding:2px 9px;border:var(--bw) solid var(--edge);background:var(--c,var(--c-reels))}
.crumb{font-family:var(--f-pix);font-size:7px;line-height:2;color:var(--muted);margin-left:auto}
.body{padding:22px 22px 28px;display:grid;gap:22px}
.body > *{min-width:0}

.hero{display:grid;gap:8px;max-width:64ch}
.eyebrow{font-family:var(--f-pix);font-size:8px;line-height:2;color:var(--muted)}
.hero h2{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.1;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:16.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-pix);font-size:7.5px;line-height:2;padding:0 7px;border:2px solid var(--edge);background:var(--paper);white-space:nowrap}
.chip.k{background:var(--c)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;background:var(--paper);padding:0;min-width:0}
.card .cth{position:relative;aspect-ratio:16/7;max-width:100%;background:var(--c);border-bottom:var(--bw) solid var(--edge);overflow:hidden}
.card .cth canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.card .cth .dur{position:absolute;right:8px;bottom:8px;font-family:var(--f-pix);font-size:7px;line-height:2;background:var(--edge);color:var(--paper);padding:0 6px}
.card .cth .who{position:absolute;left:8px;bottom:8px;font-family:var(--f-pix);font-size:7px;line-height:2;background:var(--paper);border:2px solid var(--edge);padding:0 6px}
.card .ci{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.card .ct{font-family:var(--f-head);font-weight:600;font-size:19px;line-height:1.2}
.card .cs{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:2px}
.st{font-family:var(--f-pix);font-size:7px;line-height:2;padding:0 7px;border:2px solid var(--edge);background:var(--todo)}
.st[data-s="izlendi"]{background:var(--mid)}.st[data-s="uygulaniyor"]{background:var(--ok)}
.go{font-family:var(--f-pix);font-size:8px;line-height:2}
.soon{display:grid;gap:10px}
.soon h3{margin:0;font-family:var(--f-pix);font-weight:400;font-size:8px;line-height:2;color:var(--muted)}
.soonl{display:flex;gap:10px;flex-wrap:wrap}
.soonl span{border:2px dashed var(--soft);padding:5px 10px;font-size:14px;color:var(--muted);background:var(--paper-2)}

/* NOT SAYFASI */
.back{justify-self:start;font-family:var(--f-pix);font-size:8px;line-height:2;padding:4px 10px;background:var(--paper)}
.nhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
.nhead > *{min-width:0}
.screen{background:var(--screen);border:var(--bw) solid var(--edge);box-shadow:var(--sh);aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;display:grid;place-items:center}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.55}
.screen .play{position:relative;display:flex;align-items:center;gap:10px;background:var(--c);border:var(--bw) solid var(--edge);box-shadow:var(--sh);padding:9px 14px;font-family:var(--f-pix);font-size:9px;line-height:2;color:var(--ink)}
.screen .demo{position:absolute;left:10px;top:10px;font-family:var(--f-pix);font-size:7px;line-height:2;color:var(--screen-ink);background:rgba(0,0,0,.35);padding:0 6px}
.meta{display:grid;gap:10px;align-content:start}
.mrow{display:grid;gap:4px;padding:10px 12px;border:2px solid var(--edge);background:var(--paper-2)}
.mrow .k{font-family:var(--f-pix);font-size:7px;line-height:2;color:var(--muted)}
.mrow .v{font-size:14.5px;line-height:1.4}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-family:var(--f-pix);font-size:7px;line-height:2;padding:3px 8px;border:2px solid var(--edge);background:var(--paper);cursor:pointer;box-shadow:0 2px 0 var(--edge)}
.seg button[aria-pressed="true"]{background:var(--c)}
.warnline{font-size:13px;color:var(--muted);border-left:4px solid var(--line);padding-left:10px}

.secs{display:grid;gap:18px;max-width:780px}
.sec{border:var(--bw) solid var(--edge);background:var(--paper);box-shadow:var(--sh)}
.sec > h3{margin:0;display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:var(--bw) solid var(--edge);background:var(--paper-2);font-family:var(--f-pix);font-weight:400;font-size:9px;line-height:2}
.sec > h3 i{font-style:normal;background:var(--edge);color:var(--paper);padding:0 6px;font-size:8px}
.sec .sb{padding:14px 16px 16px}
.sec .sb p{margin:0;font-size:16.5px;line-height:1.65}
.terms{margin:0;display:grid;gap:10px}
.term{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:4px 14px;padding-bottom:10px;border-bottom:2px dotted var(--line)}
.term:last-child{border-bottom:0;padding-bottom:0}
.term dt{font-family:var(--f-head);font-weight:600;font-size:16.5px;line-height:1.3}
.term dd{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;cursor:pointer;padding:8px 10px;border:2px solid var(--line);background:var(--paper)}
.step input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:var(--bw) solid var(--edge);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.step input:checked{background:var(--c-zihin)}
.step input:checked::after{content:"";width:10px;height:10px;background:var(--edge)}
.step span{font-size:15.5px;line-height:1.5}
.step:has(input:checked){border-color:var(--edge);background:var(--paper-2)}
.step:has(input:checked) span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.evid{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:15px}
.ev .lv{font-family:var(--f-pix);font-size:7px;line-height:2;padding:0 6px;border:2px solid var(--edge);white-space:nowrap}
.lv.y{background:var(--ok)}.lv.m{background:var(--mid)}.lv.n{background:var(--warn)}

/* REELS */
.rlist{display:grid;gap:10px;max-width:860px}
.rr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--paper)}
.rr .rc{width:34px;height:44px;border:2px solid var(--edge);background:var(--c);display:grid;place-items:center;font-family:var(--f-pix);font-size:8px}
.rr .rt{display:grid;gap:2px;min-width:0}
.rr .rt b{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.rr .rt small{font-family:var(--f-pix);font-size:7px;line-height:2;color:var(--muted)}
.rs{font-family:var(--f-pix);font-size:7px;line-height:2;padding:0 6px;border:2px solid var(--edge);background:var(--paper)}
.rs.ok{background:var(--ok)}.rs.wait{background:var(--mid)}.rs.skip{background:var(--paper-2);color:var(--muted)}

@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:9px;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
  .side::-webkit-scrollbar{display:none}
  .side > *{flex:none;scroll-snap-align:start}
  .side .lbl,.tip{display:none}
  .nav{padding:7px 10px}
  .nav .nn{font-size:15px}
  .nav[aria-current="page"]::after{content:none}
  .nhead{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .app{gap:12px;padding-block:12px 32px}
  .top{flex-wrap:wrap}
  .week{order:3;flex-basis:100%;height:40px}
  .streak{margin-left:auto}
  .logo{padding:6px 10px}
  .body{padding:16px 14px 22px;gap:18px}
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .term{grid-template-columns:minmax(0,1fr)}
  .crumb{display:none}
  .sec .sb{padding:12px 12px 14px}
  .sec .sb p{font-size:16px}
  .rr{grid-template-columns:auto minmax(0,1fr)}
  .rr .rs{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const R = [
 ["3 Ways To Develop a Photographic Memory","zihin","ok","Hafıza sarayı"],
 ["Dear men, please STUDY: Neuroplasticity…","zihin","ok","Nöroplastisite · Oyun teorisi"],
 ["How to systematically lock in","zihin","wait","Odak kilidi"],
 ["Boring my brain for 10 min","zihin","wait","Dopamin ve sıkılma"],
 ["Theater of Mind","zihin","wait","Zihinsel imgeleme"],
 ["6 Practices to become Dangerously Powerful","zihin","wait","Öz disiplin"],
 ["Because it finally makes AI good at teaching","ai","wait","AI ile öğrenme"],
 ["Build full games inside Claude","ai","wait","Claude'a oyun yaptırmak"],
 ["5 Claude skills for editing videos","ai","skip","Atlandı"]
];

const STATES = [["izlenecek","İZLENECEK"],["izlendi","İZLENDİ"],["uygulaniyor","UYGULANIYOR"]];
const store = (()=>{let d={};try{d=JSON.parse(localStorage.getItem("defter-demo")||"{}")}catch(e){}
  return {get:(k,f)=>k in d?d[k]:f,set:(k,v)=>{d[k]=v;try{localStorage.setItem("defter-demo",JSON.stringify(d))}catch(e){}}}})();
const status = id => store.get("s:"+id,"izlenecek");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sec = id => S.find(x=>x.id===id);
let cur = {sec:store.get("sec","ai"),note:null};

/* Piksel küçük resimler: her kart için bölüm rengine göre basit desen */
function pix(cv,seed,color,dark){
  const w=48,h=21; cv.width=w; cv.height=h; const x=cv.getContext("2d");
  let r=seed*9301+49297; const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  x.fillStyle=color; x.fillRect(0,0,w,h);
  x.fillStyle="rgba(43,37,29,.14)"; for(let i=0;i<70;i++){x.fillRect(Math.floor(rnd()*w),Math.floor(rnd()*h),1,1)}
  x.fillStyle=dark?"rgba(237,227,203,.5)":"rgba(255,250,239,.75)";
  for(let i=0;i<5;i++){const bx=Math.floor(rnd()*(w-8)),by=Math.floor(rnd()*(h-6));x.fillRect(bx,by,Math.floor(3+rnd()*6),Math.floor(2+rnd()*3))}
  x.fillStyle="#2B251D"; const k=Math.floor(rnd()*3);
  if(k===0){for(let i=0;i<w;i+=4)x.fillRect(i,h-3-Math.floor(rnd()*5),3,6)}
  else if(k===1){x.fillRect(4,h-4,w-8,1);for(let i=0;i<6;i++)x.fillRect(6+i*7,h-6-Math.floor(rnd()*8),4,1)}
  else{for(let i=0;i<4;i++){const cx=8+i*11,cy=6+Math.floor(rnd()*8);x.fillRect(cx,cy,3,3)}x.fillRect(9,h-5,w-18,1)}
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function renderSide(){
  const side=document.getElementById("side");
  side.innerHTML='<span class="lbl">BÖLÜMLER</span>'+S.map(s=>{
    const n=s.id==="reels"?R.length+" REEL":N.filter(x=>x.s===s.id).length+" NOT · "+(s.soon||[]).length+" SIRADA";
    return `<button class="nav blk" type="button" data-sec="${s.id}" style="--c:var(${s.c})" ${cur.sec===s.id?'aria-current="page"':""}>
      <span class="ico" aria-hidden="true">${s.ico}</span><span class="nt"><span class="nn">${esc(s.name)}</span><span class="nc">${n}</span></span></button>`}).join("")
    +'<div class="tip"><b>DEMO</b>Videolar ve gerçek notlar bir sonraki adımda bağlanacak.</div>';
}

function renderWeek(){
  const done=N.filter(n=>status(n.id)==="uygulaniyor").length;
  document.getElementById("wnum").textContent=done+"/"+N.length;
  document.getElementById("wfill").style.width=(done/N.length*100)+"%";
}

function renderSection(){
  const s=sec(cur.sec), p=document.getElementById("panel");
  p.style.setProperty("--c",`var(${s.c})`);
  if(s.id==="reels"){
    p.innerHTML=`<div class="bar"><span class="tab">REELS</span><span class="crumb">DEFTER / REELS KUTUSU</span></div>
    <div class="body"><div class="hero"><span class="eyebrow">INSTAGRAM KAYDEDİLENLER</span><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div>
    <div class="rlist">${R.map((r,i)=>{const rs=sec(r[1]);const lab={ok:"NOTA DÖNÜŞTÜ",wait:"BEKLİYOR",skip:"ATLANDI"}[r[2]];
      return `<div class="rr blk" style="--c:var(${rs.c})"><span class="rc" aria-hidden="true">${rs.ico}</span>
      <span class="rt"><b>${esc(r[0])}</b><small>${esc(rs.name.toUpperCase())} · ${esc(r[3].toUpperCase())}</small></span><span class="rs ${r[2]}">${lab}</span></div>`}).join("")}</div></div>`;
    return;
  }
  const notes=N.filter(n=>n.s===s.id);
  p.innerHTML=`<div class="bar"><span class="tab">${esc(s.name.toUpperCase())}</span><span class="crumb">DEFTER / ${esc(s.name.toUpperCase())}</span></div>
  <div class="body">
    <div class="hero"><span class="eyebrow">${notes.length} NOT HAZIR</span><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p></div>
    <div class="grid">${notes.map((n,i)=>`<button class="card blk" type="button" data-note="${n.id}">
      <span class="cth"><canvas data-seed="${i+3+n.id.length}" aria-hidden="true"></canvas><span class="who">${esc(n.who)}</span><span class="dur">${esc(n.dur)}</span></span>
      <span class="ci"><span class="ct">${esc(n.t)}</span><span class="cs">${esc(n.sum)}</span>
      <span class="cf"><span class="st" data-s="${status(n.id)}">${STATES.find(x=>x[0]===status(n.id))[1]}</span><span class="go">AÇ ►</span></span></span></button>`).join("")}</div>
    ${s.soon&&s.soon.length?`<div class="soon"><h3>SIRADAKİ KONULAR</h3><div class="soonl">${s.soon.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`:""}
  </div>`;
  const col=cssv(s.c);
  p.querySelectorAll("canvas").forEach(c=>pix(c,+c.dataset.seed,col,false));
}

function renderNote(){
  const n=N.find(x=>x.id===cur.note), s=sec(n.s), p=document.getElementById("panel");
  p.style.setProperty("--c",`var(${s.c})`);
  const done=store.get("c:"+n.id,[]);
  p.innerHTML=`<div class="bar"><span class="tab">${esc(s.name.toUpperCase())}</span><span class="crumb">DEFTER / ${esc(s.name.toUpperCase())} / NOT</span></div>
  <div class="body">
    <button class="back blk" type="button" data-back>◄ GERİ</button>
    <div class="hero"><span class="eyebrow">${esc(n.who)} · ${esc(n.dur)}</span><h2>${esc(n.t)}</h2></div>
    <div class="nhead">
      <div class="screen"><canvas id="scr" aria-hidden="true"></canvas><span class="demo">DEMO</span><span class="play">► VİDEO BURADA OYNAYACAK</span></div>
      <div class="meta">
        <div class="mrow"><span class="k">KAYNAK REEL</span><span class="v">${esc(n.reel)}</span></div>
        <div class="mrow"><span class="k">DURUM</span><div class="seg" role="group" aria-label="Durum">${STATES.map(x=>`<button type="button" data-st="${x[0]}" aria-pressed="${status(n.id)===x[0]}">${x[1]}</button>`).join("")}</div></div>
        <p class="warnline">Not, transkriptten henüz doğrulanmadı.</p>
      </div>
    </div>
    <div class="secs">
      <section class="sec"><h3><i>1</i>KISA ÖZET</h3><div class="sb"><p>${esc(n.sum)}</p></div></section>
      <section class="sec"><h3><i>2</i>ANA KAVRAMLAR</h3><div class="sb"><dl class="terms">${n.terms.map(t=>`<div class="term"><dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd></div>`).join("")}</dl></div></section>
      <section class="sec"><h3><i>3</i>NASIL UYGULANIR</h3><div class="sb"><ul class="steps">${n.steps.map((t,i)=>`<li><label class="step"><input type="checkbox" id="st-${n.id}-${i}" data-i="${i}" ${done.includes(i)?"checked":""}><span>${esc(t)}</span></label></li>`).join("")}</ul></div></section>
      ${n.ev?`<section class="sec"><h3><i>!</i>KANIT DURUMU</h3><div class="sb"><div class="evid">${n.ev.map(e=>`<div class="ev"><span class="lv ${e[0]}">${e[1]}</span><span>${esc(e[2])}</span></div>`).join("")}</div></div></section>`:""}
    </div>
  </div>`;
  const c=document.getElementById("scr"); pix(c,n.id.length*7,cssv("--screen"),true);
}

function render(){
  renderSide(); renderWeek();
  cur.note?renderNote():renderSection();
}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-sec]");
  if(nav){cur={sec:nav.dataset.sec,note:null};store.set("sec",cur.sec);render();
    if(matchMedia("(max-width:860px)").matches)document.getElementById("panel").scrollIntoView({block:"start",behavior:"smooth"});
    nav.scrollIntoView({inline:"nearest",block:"nearest"});return}
  const card=e.target.closest("[data-note]");
  if(card){cur.note=card.dataset.note;render();document.getElementById("panel").scrollIntoView({block:"start"});return}
  if(e.target.closest("[data-back]")){cur.note=null;render();return}
  const st=e.target.closest("[data-st]");
  if(st){store.set("s:"+cur.note,st.dataset.st);render();return}
});
document.addEventListener("change",e=>{
  const cb=e.target.closest(".step input"); if(!cb)return;
  const k="c:"+cur.note; let d=store.get(k,[]); const i=+cb.dataset.i;
  d=cb.checked?[...new Set([...d,i])]:d.filter(x=>x!==i); store.set(k,d);
  const n=N.find(x=>x.id===cur.note);
  if(d.length===n.steps.length&&status(n.id)!=="uygulaniyor"){store.set("s:"+n.id,"uygulaniyor");render()}
});
if(!sec(cur.sec))cur.sec="ai";
render();
</script>
